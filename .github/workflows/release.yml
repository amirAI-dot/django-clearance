# Publishes django-clearance to PyPI.
#
# Runs when a release is published on GitHub, or by hand ("Run workflow",
# from main, naming the tag) - for a release published before this file
# existed, whose tag does not hold it. PyPI trusts this file by name - Trusted Publishing - so no token is
# stored anywhere: the publish job proves who it is with GitHub's OIDC token,
# and only from the "pypi" environment.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@v7

      - name: The tag names the version being published
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not name the version in pyproject.toml, $version."
            exit 1
          fi

      # The wheel installed alone, and the example project's tests run on it.
      - run: uvx nox --download-python auto -s package

      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-clearance/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

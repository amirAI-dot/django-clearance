# The documentation site - MkDocs with the Material theme, in English and in
# Persian (right to left). A page is docs/<name>.md, and its Persian is
# docs/<name>.fa.md beside it. Built by `nox -s docs`, published from main.

site_name: django-clearance
site_description: Role, policy and row-level access control for Django. Denied by default.
site_url: https://amirai-dot.github.io/django-clearance/
repo_url: https://github.com/amirAI-dot/django-clearance
repo_name: amirAI-dot/django-clearance
edit_uri: edit/main/docs/
copyright: BSD 3-Clause licence

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fa
          name: فارسی
          build: true
          theme:
            language: fa
          nav_translations:
            Home: خانه
            Getting started: شروع
            Tutorial: آموزش
            Admin panel: پنل ادمین
            Guide: راهنما
            Design: طراحی
            Changelog: تغییرات

nav:
  - Home: index.md
  - Getting started:
      - getting-started/introduction.md
      - getting-started/installation.md
      - getting-started/quickstart.md
  - Tutorial:
      - tutorial/index.md
      - tutorial/01-the-shop.md
      - tutorial/02-permissions.md
      - tutorial/03-bundles.md
      - tutorial/04-row-scopes.md
      - tutorial/05-rule-scopes.md
      - tutorial/06-protected-fields.md
      - tutorial/07-status-actions.md
      - tutorial/08-policies.md
      - tutorial/09-views-and-the-api.md
      - tutorial/10-roles.md
      - tutorial/11-access-as-code.md
      - tutorial/12-names-in-every-language.md
  - Admin panel:
      - admin/index.md
      - admin/your-models.md
      - admin/bundles.md
      - admin/people.md
      - admin/permissions.md
      - admin/row-scopes.md
      - admin/protected-fields.md
      - admin/actions.md
      - admin/roles.md
      - admin/names.md
      - admin/safety-rules.md
  - Guide: guide.md
  - Design: design.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
